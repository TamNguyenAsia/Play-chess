<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a0a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cờ Vua</title>
<style>
:root{--bg:#f4ede1;--fg:#2b2118;--card:#fffaf0;--acc:#8a5a2b;--ln:#d9c7aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1814;--fg:#f1e7d6;--card:#2a241d;--acc:#e0a65c;--ln:#4a3f33}}
:root[data-theme="dark"]{--bg:#1c1814;--fg:#f1e7d6;--card:#2a241d;--acc:#e0a65c;--ln:#4a3f33}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;user-select:none}
h1{margin:10px 0 2px;font-size:22px;letter-spacing:.5px}
.wrap{width:min(96vw,540px)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
select,button{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--fg)}
button{cursor:pointer;font-weight:600}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:active{transform:scale(.97)}
label{display:flex;align-items:center;gap:5px}
#cap{display:flex;justify-content:space-between;height:28px;line-height:28px;overflow:hidden;white-space:nowrap;font-size:20px;color:var(--fg);opacity:.85}
#bdw{container-type:inline-size}
#bd{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;border:7px solid #5a3a1c;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 0 0 1px #00000040;overflow:hidden;background:#5a3a1c}
.sq{position:relative;overflow:hidden;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:9.6cqw;line-height:1;background:#f0d9b5}
.sq.d{background:#b58863}
.sq i{position:absolute;font:600 10px system-ui;font-style:normal;opacity:.7;color:#5a3a1c}
.sq.d i{color:#f0d9b5}
.sq i.f{right:3px;bottom:1px}.sq i.r{left:3px;top:1px}
.pc{display:flex;align-items:center;justify-content:center;width:100%;height:100%;transition:transform .12s;pointer-events:none}
.pc img{width:94%;height:94%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.sel{box-shadow:inset 0 0 0 100px rgba(70,160,255,.45)}
.sel .pc{transform:scale(1.12)}
.lm{box-shadow:inset 0 0 0 100px rgba(255,220,60,.4)}
.chk{background-image:radial-gradient(circle,rgba(255,30,30,.9) 0,rgba(255,30,30,0) 70%)}
.hn{box-shadow:inset 0 0 0 3px #1fd16a,inset 0 0 0 100px rgba(31,209,106,.28)}
.tg::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,120,60,.55)}
.tg.cp::after{width:88%;height:88%;background:none;border:5px solid rgba(20,120,60,.6);box-sizing:border-box}
#st{margin:10px 2px;height:68px;overflow:auto;box-sizing:border-box;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--ln);line-height:1.4}
.ft{margin:6px 0 14px;font-size:12px;opacity:.65;text-align:center}
</style></head><body>
<h1>♞ Cờ Vua</h1>
<div class="wrap">
<div class="bar">
<select id="lv" aria-label="Cấp độ"><option value="1">Cấp 1 · Tập sự</option><option value="2">Cấp 2 · Dễ</option><option value="3" selected>Cấp 3 · Trung bình</option><option value="4">Cấp 4 · Khó</option><option value="5">Cấp 5 · Cao thủ</option></select>
<select id="sd" aria-label="Màu quân"><option value="w">Chơi Trắng</option><option value="b">Chơi Đen</option></select>
<select id="ps" aria-label="Kiểu quân cờ"><option value="0">Quân: Cổ điển</option><option value="1">Quân: Truyền thống</option><option value="2">Quân: Hiện đại</option><option value="3">Quân: Fantasy</option></select>
<label><input type="checkbox" id="gd" checked> Chỉ dẫn</label>
</div>
<div id="cap"><span id="c1"></span><span id="c2"></span></div>
<div id="bdw"><div id="bd"></div></div>
<div id="st">Chọn quân của bạn để bắt đầu.</div>
<div class="bar"><button class="p" id="nw">Ván mới</button><button id="un">↩ Đi lại</button><button id="ht">💡 Gợi ý</button></div>
<div class="ft">Tốt đi tới cuối bàn sẽ tự phong Hậu.<br>Quân cờ: bộ Cburnett, Merida, California, Fantasy từ lichess.org (mã nguồn mở).</div>
</div>
